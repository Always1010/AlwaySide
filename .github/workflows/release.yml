name: Android Release
run-name: Release ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          persist-credentials: false

      - name: Validate release version
        run: |
          # Three decimal components, 0..999 each, without leading zeroes.
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo '::error::Expected a version tag such as v0.6.1 (components 0..999, no prerelease suffix).'
            exit 1
          fi
          version_code=$((BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3]))
          if (( version_code == 0 )); then
            echo '::error::v0.0.0 is not a releasable Android version.'
            exit 1
          fi
          echo "ORG_GRADLE_PROJECT_releaseVersionName=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_releaseVersionCode=$version_code" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/android/**/*.gradle.kts
            apps/android/gradle.properties
            apps/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set release signing key path
        run: |
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/alwayside-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_SIGNING_LINEAGE_PATH=$RUNNER_TEMP/alwayside.lineage" >> "$GITHUB_ENV"

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_LINEAGE_BASE64: ${{ secrets.ANDROID_SIGNING_LINEAGE_BASE64 }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > /dev/null
          if [[ -n "$ANDROID_SIGNING_LINEAGE_BASE64" ]]; then
            printf '%s' "$ANDROID_SIGNING_LINEAGE_BASE64" | base64 --decode > "$ANDROID_SIGNING_LINEAGE_PATH"
          fi

      - name: Ensure Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Lint and build signed release APK
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon --console=plain :app:lintRelease :app:assembleRelease

      - name: Verify and package APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          apk=apps/android/app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist
          output="dist/AlwaySide-$RELEASE_TAG.apk"
          if [[ -s "$ANDROID_SIGNING_LINEAGE_PATH" ]]; then
            # The app requires API 29+. V3 supports rotation without retaining
            # the old private key for V1/V2 compatibility on older devices.
            "$tools/apksigner" sign \
              --ks "$ANDROID_KEYSTORE_PATH" --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
              --lineage "$ANDROID_SIGNING_LINEAGE_PATH" --rotation-min-sdk-version 28 \
              --v1-signing-enabled false --v2-signing-enabled false \
              --v3-signing-enabled true --v4-signing-enabled false \
              --out "$output" "$apk"
          else
            cp "$apk" "$output"
          fi
          "$tools/apksigner" verify --verbose --print-certs "$output"
          badging=$("$tools/aapt" dump badging "$output")
          package_line=${badging%%$'\n'*}
          grep -F "name='com.alwayside.android'" <<< "$package_line"
          grep -F "versionName='$ORG_GRADLE_PROJECT_releaseVersionName'" <<< "$package_line"
          grep -F "versionCode='$ORG_GRADLE_PROJECT_releaseVersionCode'" <<< "$package_line"
          cd dist
          sha256sum "AlwaySide-$RELEASE_TAG.apk" > "AlwaySide-$RELEASE_TAG.apk.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/AlwaySide-$RELEASE_TAG.apk" \
            "dist/AlwaySide-$RELEASE_TAG.apk.sha256" \
            --verify-tag --title "AlwaySide $RELEASE_TAG" --generate-notes

      - name: Remove signing key
        if: always()
        run: rm -f -- "$ANDROID_KEYSTORE_PATH" "$ANDROID_SIGNING_LINEAGE_PATH"
