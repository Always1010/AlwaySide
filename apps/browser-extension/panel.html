<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AlwaySide · 阅读伴侣</title>
  <link rel="stylesheet" href="panel.css">
  <script type="module" src="panel.mjs"></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6c-3-2-6-2-9-1v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Zm0 0v14"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-.6 3-2.4 1-2.5-1.5-2 3.5L4 11v2l-2.5 2 2 3.5L6 17l2.4 1 .6 3h4l.6-3 2.4-1 2.5 1.5 2-3.5-2.5-2v-2l2.5-2-2-3.5L16 7l-2.4-1-.6-3Z"/><circle cx="11" cy="12" r="3"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 20V4m-6 6 6-6 6 6"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 5h16M4 10h16M4 15h12M4 20h8"/></symbol>
    <symbol id="i-select" viewBox="0 0 24 24"><path d="M8 4H5v16h3M16 4h3v16h-3M9 8h6M9 12h6M9 16h6"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="m8 5 1-2h6l1 2h5v16H3V5Z"/><circle cx="12" cy="12" r="4"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="m10 13 4-4M8 16l-1 1a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0m0 12a4 4 0 0 0 6 0l5-5a4 4 0 0 0-6-6l-1 1" transform="translate(1 0) scale(.9)"/></symbol>
  </defs></svg>
  <header class="app-header">
    <div class="brand"><span class="brand-mark"><svg><use href="#i-book"/></svg></span><div><strong>AlwaySide</strong><span>让阅读，走深一点</span></div></div>
    <nav aria-label="侧栏工具">
      <button id="new-chat" class="icon-button" aria-label="新对话" data-tip="新对话"><svg><use href="#i-plus"/></svg></button>
      <button id="open-history" class="icon-button" aria-label="本地历史" data-tip="本地历史"><svg><use href="#i-clock"/></svg></button>
      <button id="open-settings" class="icon-button" aria-label="设置" data-tip="设置"><svg><use href="#i-settings"/></svg></button>
    </nav>
  </header>
  <main id="main">
    <section class="capture-section" aria-labelledby="capture-heading">
      <div class="section-label"><h1 id="capture-heading">此刻，读点什么</h1><span class="local-badge">手动取材</span></div>
      <div class="capture-actions">
        <button data-capture="selection"><svg><use href="#i-select"/></svg><span>选中文字</span></button>
        <button data-capture="page"><svg><use href="#i-text"/></svg><span>网页文字</span></button>
        <button data-capture="screenshot"><svg><use href="#i-camera"/></svg><span>当前截图</span></button>
      </div>
      <p class="capture-help">先在网页上点击扩展图标取得访问许可。资料只在点击发送后传给 OpenAI。</p>
      <div id="evidence-slot"></div>
    </section>
    <div id="notice" class="notice" role="status" hidden><span id="notice-text"></span><button id="retry-save" class="text-button" hidden>重试保存</button></div>
    <section id="conversation" aria-label="当前对话">
      <div id="welcome" class="welcome"><span class="eyebrow">你的阅读留白</span><h2>把疑问放在这里。</h2><p>翻译一段文字，理清一个概念，<br>或者沿着好奇心，继续追问。</p><div class="starter-list"><button data-prompt="请用中文概括这份资料的重点。">概括重点 <span>↗</span></button><button data-prompt="请解释这份资料中最难理解的概念。">解释概念 <span>↗</span></button></div></div>
      <div id="turns"></div>
    </section>
  </main>
  <footer class="composer-area">
    <div id="request-status" class="request-status" role="status" aria-live="polite">准备好了</div>
    <form id="question-form" class="composer">
      <label class="sr-only" for="question">问题或追问</label>
      <textarea id="question" rows="2" placeholder="问点什么，或直接发送使用默认问题…" maxlength="2000"></textarea>
      <div class="composer-bottom"><span id="composer-hint">Enter 换行 · Ctrl / ⌘ + Enter 发送</span><button id="send" class="send-button icon-button" type="submit" aria-label="发送问题" data-tip="发送问题"><svg><use href="#i-send"/></svg></button><button id="stop" class="stop-button icon-button" type="button" aria-label="停止回答" data-tip="停止回答" hidden><svg><use href="#i-stop"/></svg></button></div>
    </form>
    <p class="privacy-note">本地历史 · 会话密钥 · 由你决定何时发送</p>
  </footer>
  <dialog id="settings-dialog" aria-labelledby="settings-heading">
    <div class="dialog-header"><div><span class="eyebrow">偏好与连接</span><h2 id="settings-heading">设置</h2></div><button class="icon-button" data-close="settings-dialog" aria-label="关闭设置" data-tip="关闭"><svg><use href="#i-close"/></svg></button></div>
    <form id="settings-form">
      <label for="api-key">OpenAI API Key</label><input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-…">
      <p class="field-note">仅保存在本次浏览器会话中；浏览器重启后需重新填写。密钥不交给网页，也不写入本地历史。</p>
      <label for="model">模型</label><select id="model" required></select>
      <div class="field-row"><div><label for="reasoning">推理程度</label><select id="reasoning"></select></div><div><label for="search-mode">联网搜索</label><select id="search-mode"><option value="off">关闭</option><option value="auto">自动</option><option value="required">必须搜索</option></select></div></div>
      <label for="max-tokens">最大输出 Token（含推理，1,024–128,000）</label><input id="max-tokens" type="number" min="1024" max="128000" step="1" required>
      <label for="default-question">默认问题（最多 2,000 字）</label><textarea id="default-question" rows="3" required maxlength="2000"></textarea>
      <label for="instructions">自定义指令（最多 20,000 字）</label><textarea id="instructions" rows="4" maxlength="20000" placeholder="例如：优先用简洁的中文回答。"></textarea>
      <p id="settings-error" class="form-error" role="alert" hidden></p>
      <div class="dialog-footer"><span>保存设置不会联网。</span><button id="save-settings" type="submit" class="primary-button">保存设置</button></div>
    </form>
  </dialog>
  <dialog id="history-dialog" aria-labelledby="history-heading"><div class="dialog-header"><div><span class="eyebrow">留在这台设备</span><h2 id="history-heading">本地历史</h2></div><button class="icon-button" data-close="history-dialog" aria-label="关闭历史" data-tip="关闭"><svg><use href="#i-close"/></svg></button></div><p class="field-note history-note">最多保留 30 个对话。资料和回答存于此浏览器；删除后不可恢复。</p><button id="reload-history" class="text-button" type="button">重新读取本机历史</button><p id="history-status" class="field-note" role="status"></p><div id="history-list"></div></dialog>
</body>
</html>
